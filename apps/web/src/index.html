  <script>
    (function () {
      var started = Date.now();

      // Installed app behaves like a native app: no pinch / double-tap zoom.
      // The website in a normal browser keeps zoom for accessibility.
      var installed = (window.matchMedia && (matchMedia('(display-mode: standalone)').matches ||
        matchMedia('(display-mode: fullscreen)').matches)) || navigator.standalone === true;
      if (installed) {
        document.documentElement.classList.add('installed-app');
        document.querySelector('meta[name=viewport]').setAttribute('content',
          'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
        // iOS ignores user-scalable=no, so block its pinch gesture directly
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      }
      var forced = /[?&]splash\b/.test(location.search);
      if (forced) document.documentElement.classList.add('force-splash');
      // The splash belongs to opening the app. sessionStorage survives a refresh but not closing the app,
      // so a pull-to-refresh or reload skips it and the next real launch plays it again.
      var relaunch = false;
      try {
        relaunch = sessionStorage.getItem('gc-splash-shown') === '1';
        sessionStorage.setItem('gc-splash-shown', '1');
      } catch (e) { /* storage blocked: keep showing it */ }
      if (relaunch && !forced) document.documentElement.classList.add('skip-splash');
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var MIN_MS = reduce ? 300 : 2200;
      var hidden = false;

      window.__hideSplash = function () {
        if (hidden) return;
        hidden = true;
        var el = document.getElementById('app-splash');
        if (!el) return;
        if (getComputedStyle(el).display === 'none') { el.remove(); return; }
        setTimeout(function () {
          el.classList.add('hide');
          setTimeout(function () { el.remove(); }, 500);
        }, Math.max(0, MIN_MS - (Date.now() - started)));
      };
      setTimeout(window.__hideSplash, 8000);
    })();
  </script>
