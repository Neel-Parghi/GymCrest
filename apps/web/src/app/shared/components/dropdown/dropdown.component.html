<div class="custom-select" [class.open]="isOpen" [class.disabled]="disabled" [style.min-width]="minWidth">
  <div class="select-trigger" (click)="toggleDropdown()">
    <div class="trigger-content">
      <i *ngIf="getSelectedIcon()" [class]="getSelectedIcon()"></i>
      <div class="text-grid">
        <span class="selected-text">{{ getSelectedLabel() }}</span>
        <span class="sizer-hidden" aria-hidden="true">{{ getLongestLabel() }}</span>
      </div>
    </div>
    <i class="fa-solid fa-chevron-down arrow"></i>
  </div>

  <div class="select-options" [class.align-right]="align === 'right'" [class.align-left]="align === 'left'"
    [class.drop-up]="actualDirection === 'up'" [class.drop-down]="actualDirection === 'down'"
    [class.fixed-position]="!insideDrawer" [class.absolute-position]="insideDrawer"
    [style.top]="insideDrawer ? null : dropdownTop" [style.bottom]="insideDrawer ? null : dropdownBottom"
    [style.left]="insideDrawer ? null : dropdownLeft" [style.width]="insideDrawer ? null : dropdownWidth"
    [style.minWidth]="insideDrawer ? minWidth : null">

    <div class="dropdown-search" *ngIf="isSearchable" (click)="onSearch($event)">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" [formControl]="searchControl" placeholder="Search..." (click)="$event.stopPropagation()" [maxlength]="limits.SEARCH">
    </div>

    <div *ngFor="let option of filteredOptions; trackBy: trackByValue" class="option" [class.selected]="option.value === value"
      (click)="selectOption(option)">
      <i *ngIf="option.icon" [class]="option.icon"></i>
      {{ option.label }}
      <i *ngIf="option.value === value" class="fa-solid fa-check check-icon"></i>
    </div>

    <div class="no-results" *ngIf="isSearchable && filteredOptions.length === 0">
      No results found
    </div>
  </div>

</div>
