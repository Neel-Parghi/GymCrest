<div class="modal-overlay">
  <div class="modal-container">

    <div class="modal-header">
      <div class="header-titles">
        <h2>Add Subscription Plan</h2>
        <p>Create a new pricing tier for your platform.</p>
      </div>
      <button class="close-btn" (click)="closeModal()" title="Cancel">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor"
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <form [formGroup]="pricingForm" class="pricing-form">

        <div class="form-grid">
          <div class="form-group lg">
            <label>Plan Name <span class="required">*</span></label>
            <input type="text" formControlName="name" placeholder="e.g. Pro Tier" [maxlength]="limits.PLAN_NAME" />
            <app-validation-message [control]="pricingForm.get('name')" fieldName="Plan name"></app-validation-message>
          </div>

          <div class="form-group lg">
            <label>Description</label>
            <textarea formControlName="description" placeholder="Short description of benefits..." [maxlength]="limits.DESCRIPTION"></textarea>
          </div>

          <div class="form-group">
            <label>Price (₹) <span class="required">*</span></label>
            <input type="number" formControlName="price" placeholder="499" />
            <app-validation-message [control]="pricingForm.get('price')" fieldName="Price"></app-validation-message>
          </div>

          <div class="form-group">
            <label>Duration (Days) <span class="required">*</span></label>
            <input type="number" formControlName="durationInDays" placeholder="30" />
            <app-validation-message [control]="pricingForm.get('durationInDays')"
              fieldName="Duration"></app-validation-message>
          </div>

          <div class="form-group">
            <label>Max Branches <span class="optional">(Optional)</span></label>
            <input type="number" formControlName="maxBranches" placeholder="e.g. 5" />
          </div>

          <div class="form-group">
            <label>Max Members <span class="optional">(Optional)</span></label>
            <input type="number" formControlName="maxMembers" placeholder="e.g. 2000" />
          </div>

          <div class="form-group lg">
            <label>Features <span class="optional">(one per line)</span></label>
            <textarea formControlName="featuresText" rows="6"
              placeholder="Member records, plans & one-click renewals&#10;Invoices & online payments via Razorpay"></textarea>
            <span class="field-hint">Shown as the checklist on the public pricing page. The member and branch limits are added automatically.</span>
          </div>

          <div class="form-group flex-row">
            <label class="toggle-switch">
              <input type="checkbox" formControlName="isTrial" />
              <span class="slider round"></span>
            </label>
            <div class="toggle-label">
              <strong>Is Trial Plan</strong>
              <span>Enable free trialing mode</span>
            </div>
          </div>

          <div class="form-group flex-row">
            <label class="toggle-switch">
              <input type="checkbox" formControlName="isActive" />
              <span class="slider round"></span>
            </label>
            <div class="toggle-label">
              <strong>Active Status</strong>
              <span>Plan is available for purchase</span>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <div class="footer-left">
        <button class="secondary-btn" (click)="onTopClose()">Cancel</button>
      </div>
      <div class="footer-right">
        <button class="primary-btn" (click)="onSubmit()" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : 'Create Plan' }}
        </button>
      </div>
    </div>
  </div>
</div>


@if (isConfirmCancelOpen) {
<app-confirmation-popup title="Discard Changes?" message="You have unsaved changes. Are you sure you want to cancel?"
  confirmText="Discard" cancelText="Keep Editing" type="danger" (confirm)="closeModal()"
  (cancel)="isConfirmCancelOpen = false">
</app-confirmation-popup>
}
