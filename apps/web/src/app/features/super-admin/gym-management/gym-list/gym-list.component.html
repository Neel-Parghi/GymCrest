<div class="standard-container">
  <div class="page-header">
    <div class="header-info">
      <h2>Gym List</h2>
      <p>Comprehensive directory of all gyms on the platform.</p>
    </div>
    @if (selectedGyms.length === 0) {
    <button class="btn-add" (click)="openAddGymModal()">Add Gym</button>
    } @else {
    <div class="selection-actions">
      <button class="btn-outline" (click)="clearSelection()">Clear selection</button>
      <button class="btn-danger" [disabled]="isBulkDeleting" (click)="deleteSelected()">
        Delete {{ selectedGyms.length }} selected
      </button>
    </div>
    }
  </div>

  <app-filter-bar [filterConfigs]="filterConfigs" placeholder="Search gyms by name..." [debounce]="2000"
    (filterChanged)="onFilterChanged($event)">
  </app-filter-bar>

  <app-data-grid #grid [config]="gridConfig" [data]="displayData" [totalItems]="totalItems" [pageSize]="pageSize"
    [currentPage]="currentPage" (selectionChange)="onSelectionChange($event)" (actionEvent)="handleAction($event)"
    (pageChange)="onPageChanged($event)" (pageSizeChange)="onPageSizeChanged($event)">
  </app-data-grid>
</div>

<!-- Gym Details Drawer -->
<app-gym-details-drawer [isOpen]="isDetailsDrawerOpen" [gym]="selectedGymDetail" [isEditing]="isEditMode"
  (closeDrawer)="closeDetailDrawer()" (gymUpdated)="updateGym($event)">
</app-gym-details-drawer>

<!-- Gym Onboarding Modal -->
@if (isAddGymModalOpen)
{
<app-gym-onboarding-modal (close)="closeAddGymModal()">
</app-gym-onboarding-modal>
}
