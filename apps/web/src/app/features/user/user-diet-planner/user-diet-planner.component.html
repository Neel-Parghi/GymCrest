<div class="user-page-wrapper">

  <header class="page-head">
    <h1>Nutrition</h1>
    @if (activeDiet?.planName) {
      <p>Plan: {{ activeDiet.planName }}</p>
    }
  </header>

  <app-segmented-tabs class="member-tabs" [tabs]="tabs" [active]="viewMode" label="Nutrition views" (selected)="setView($event)" />

  <app-member-detail-diet-chart *ngIf="viewMode === 'active'" [activeDiet]="activeDiet" [memberId]="userId"
    [memberInfo]="memberInfo" (openAssignModal)="setView('library')" (customDietSaved)="loadActiveDiet()">
  </app-member-detail-diet-chart>

  <app-diet-library *ngIf="viewMode === 'library'" [currentUserId]="userId" [activeDietId]="activeDiet?.planId"
    [dietPreference]="dietPreference"
    [isCardView]="true" [embedded]="true" (onAssign)="assignDietPlan($event)">
  </app-diet-library>

</div>
