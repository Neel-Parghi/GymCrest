  <app-member-detail-workout-calendar [workoutHistory]="workoutHistory" [activeSplit]="activeSplit"
    [planAssignments]="planAssignments" [workoutOverrides]="workoutOverrides" [dailyPlans]="dailyPlans"
    (openAssignModal)="openAssignSplitModal()"
    (updateOverrides)="onUpdateOverrides($event)" (logDateWorkout)="onLogDateWorkout($event)"
    (editWorkout)="onEditWorkoutSession($event)" (changeTab)="onTrackToday()">
  </app-member-detail-workout-calendar>

  <!-- WORKOUT ASSIGNMENT MODAL -->
  <app-assign-workout-modal *ngIf="showAssignSplitModal" [plans]="workoutPlans" [activePlanId]="activeSplit?.planId ?? null"
    [activePlanName]="activeSplit?.planName ?? null"
    (assignProgram)="assignWorkoutSplit($event)" (assignDaily)="assignDailyWorkout($event)"
    (closed)="closeAssignSplitModal()">
  </app-assign-workout-modal>
</div>
